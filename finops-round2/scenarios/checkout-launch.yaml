# checkout-service on LAUNCH DAY. The product launch is not in the 30-day history -
# it's the event that hasn't happened yet. The cart-cache working set climbs to
# ~720Mi, categorically bigger than any of the 30 daily peaks (max was 494Mi).
# The AI's 640Mi ceiling - 30% over the worst day it ever saw - is not enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  labels: { app: checkout-service, team: payments, demo: history }
spec:
  replicas: 2
  selector: { matchLabels: { app: checkout-service } }
  template:
    metadata: { labels: { app: checkout-service } }
    spec:
      containers:
        - name: app
          image: polinux/stress:latest
          command: ["stress"]
          # launch-day peak: bigger than anything in a month of data
          args: ["--vm", "1", "--vm-bytes", "720M", "--vm-hang", "0", "--timeout", "36000s"]
          resources:
            requests: { memory: "480Mi", cpu: "50m" }
            limits: { memory: "640Mi" }      # the AI's history-derived ceiling
