# Fast-firing versions of the standard Kubernetes pod alerts, so the demo
# doesn't wait 15 minutes. Teams routinely tune these thresholds; here `for: 1m`
# means "if the pod is still broken a minute later, page the night-shift agent."
# The `release: kps` label is what this stack's Prometheus selects rules on.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nightshift-fast
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: nightshift.pod.fast
      rules:
        - alert: PodCrashLooping
          # restart-rate based (like the real KubePodCrashLooping): fires reliably
          # whenever a container restarts repeatedly, regardless of the exact
          # waiting-reason snapshot.
          expr: increase(kube_pod_container_status_restarts_total[3m]) > 2
          for: 1m
          labels: { severity: warning, team: nightshift }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff"
            reason: "CrashLoopBackOff"
        - alert: PodImagePullError
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"}) == 1
          for: 1m
          labels: { severity: warning, team: nightshift }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
            reason: "ImagePullBackOff"
        - alert: PodPendingUnschedulable
          expr: max by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
          for: 1m
          labels: { severity: warning, team: nightshift }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck Pending"
            reason: "Pending"
        - alert: PodNotReady
          expr: max by (namespace, pod) (kube_pod_status_ready{condition="false"} * on(namespace, pod) kube_pod_status_phase{phase="Running"}) == 1
          for: 2m
          labels: { severity: warning, team: nightshift }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is Running but not Ready"
            reason: "NotReady"
