# two tiny backends that echo a fixed string for ANY path, so routing is unambiguous:
#   web-svc  -> "WEB-BACKEND"   (the homepage)
#   api-svc  -> "API-BACKEND"   (the API, served under /api/...)
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-echo, labels: { app: web-echo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-echo } }
  template:
    metadata: { labels: { app: web-echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:latest
          args: ["-text=WEB-BACKEND", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: web-svc }
spec:
  selector: { app: web-echo }
  ports: [{ port: 80, targetPort: 5678 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-echo, labels: { app: api-echo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-echo } }
  template:
    metadata: { labels: { app: api-echo } }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:latest
          args: ["-text=API-BACKEND", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: api-svc }
spec:
  selector: { app: api-echo }
  ports: [{ port: 80, targetPort: 5678 }]
