# checkout-service at the AI's history-derived sizing (limit 640Mi = 30% over the
# worst peak in 30 days), driven to the WORST NORMAL EVENING observed all month
# (~495Mi). This is the AI's win: every peak the data ever showed, it handles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  labels: { app: checkout-service, team: payments, demo: history }
spec:
  replicas: 2                         # AI kept 2 (it reasoned about failover)
  selector: { matchLabels: { app: checkout-service } }
  template:
    metadata: { labels: { app: checkout-service } }
    spec:
      containers:
        - name: app
          image: polinux/stress:latest
          command: ["stress"]
          # the worst normal evening in the whole month (~495Mi)
          args: ["--vm", "1", "--vm-bytes", "495M", "--vm-hang", "0", "--timeout", "36000s"]
          resources:
            requests: { memory: "480Mi", cpu: "50m" }
            limits: { memory: "640Mi" }      # AI: 30% over the 30-day max
