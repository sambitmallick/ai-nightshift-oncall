    metadata: { labels: { app: image-thumbnailer } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ['dd if=/dev/zero of=/data/blob bs=1M count=120 2>/dev/null; echo "image-thumbnailer up, holding 120Mi"; sleep 36000']
          resources:
            requests: { memory: "1Gi", cpu: "250m" }       # genuinely over-provisioned
            limits: { memory: "1Gi" }
          volumeMounts: [{ name: mem, mountPath: /data }]
      volumes: [{ name: mem, emptyDir: { medium: Memory } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-sender
  labels: { app: notification-sender, team: growth, demo: finops }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-sender } }
  template:
    metadata: { labels: { app: notification-sender } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ['dd if=/dev/zero of=/data/blob bs=1M count=90 2>/dev/null; echo "notification-sender up, holding 90Mi"; sleep 36000']
          resources:
            requests: { memory: "768Mi", cpu: "200m" }     # genuinely over-provisioned
            limits: { memory: "768Mi" }
          volumeMounts: [{ name: mem, mountPath: /data }]
      volumes: [{ name: mem, emptyDir: { medium: Memory } }]
