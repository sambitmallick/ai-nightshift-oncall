# SAFE incident: CrashLoopBackOff because a required env var was dropped from the
# deployment spec. Root cause is visible in the logs + the spec (no env section).
# Expected AI fix: kubectl set env deployment/payments-api DB_HOST=<...>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels: { app: payments-api, demo: nightshift, tier: backend }
spec:
  replicas: 1
  selector: { matchLabels: { app: payments-api } }
  template:
    metadata: { labels: { app: payments-api } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "payments-api v1.8.2 starting..."; sleep 5; if [ -z "$DB_HOST" ]; then echo "FATAL: DB_HOST environment variable is not set. Cannot start."; exit 1; fi; echo "connected to $DB_HOST, serving on :8080"; sleep 3600'
